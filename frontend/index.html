<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CANOPY detects tree crowns and measures canopy cover from satellite imagery, and says plainly what it cannot measure." />
    <title>CANOPY · Tree crown and canopy analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Dark Matter is the default. BoardUI's ThemeToggle reads this key, so seed it before first paint.
      try {
        var k = "boardui:theme";
        if (!localStorage.getItem(k)) localStorage.setItem(k, "dark");
        document.documentElement.classList.toggle("dark", localStorage.getItem(k) === "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
