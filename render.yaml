services:
  - type: web
    name: canopy-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /healthz
    # Projects need a persistent disk (paid plans). Without one they reset on every deploy.
    # disk:
    #   name: canopy-data
    #   mountPath: /data
    #   sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CANOPY_DATA_DIR
        value: /data
      # Replace the Vercel domain with the real production URL. Never "*".
      - key: CANOPY_CORS_ORIGINS
        value: https://canopyy.vercel.app,http://localhost:5173
